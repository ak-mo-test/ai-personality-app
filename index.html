<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Pipeline Studio - Mobile Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bg-dark: #0f172a;
  --bg-card: #1e293b;
  --bg-surface: #334155;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --border: #475569;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  touch-action: pan-x pan-y;
}

/* Mobile Layout */
.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 100vw;
}

/* Header */
.header {
  background: var(--bg-card);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  background: var(--primary);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.btn {
  padding: 10px 16px;
  border-radius: 10px;
  border: none;
  background: var(--primary);
  color: white;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}

.btn:hover {
  background: var(--primary-dark);
  transform: translateY(-1px);
}

.btn-sm {
  padding: 8px 12px;
  font-size: 13px;
}

.btn-success {
  background: var(--success);
}

.btn-warning {
  background: var(--warning);
}

.btn-danger {
  background: var(--danger);
}

/* Main Content Area */
.main-content {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* Sidebar (Hidden on mobile, shown via toggle) */
.sidebar {
  width: 280px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: none;
  flex-direction: column;
  gap: 16px;
  padding: 16px;
  position: absolute;
  height: 100%;
  z-index: 90;
  left: 0;
  top: 0;
}

.sidebar.active {
  display: flex;
}

.sidebar-section {
  background: var(--bg-surface);
  border-radius: 12px;
  padding: 16px;
}

.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Workspace Canvas */
.workspace {
  flex: 1;
  position: relative;
  overflow: auto;
  background: 
    linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)),
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 19px,
      rgba(71, 85, 105, 0.1) 19px,
      rgba(71, 85, 105, 0.1) 20px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 19px,
      rgba(71, 85, 105, 0.1) 19px,
      rgba(71, 85, 105, 0.1) 20px
    );
  background-size: 100% 100%, 20px 20px, 20px 20px;
  min-height: calc(100vh - 140px);
  padding: 20px;
}

/* AI Node Styles */
.ai-node {
  position: absolute;
  width: 260px;
  background: var(--bg-card);
  border-radius: 14px;
  border: 2px solid var(--border);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  z-index: 10;
  transition: all 0.3s ease;
  touch-action: none;
}

.ai-node:hover {
  border-color: var(--primary);
  box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
}

.node-header {
  padding: 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 14px 14px 0 0;
}

.node-title {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.node-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.node-text {
  min-width: 0;
}

.node-name {
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.node-model {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.node-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.node-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--bg-surface);
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.2s;
}

.node-btn:hover {
  background: var(--primary);
  color: white;
}

.node-body {
  padding: 14px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  max-height: 100px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

.node-connectors {
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  border-top: 1px solid var(--border);
}

.connector {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: all 0.2s;
}

.connector:hover {
  transform: scale(1.1);
}

.connector-input {
  background: var(--success);
}

.connector-output {
  background: var(--primary);
}

.connector i {
  color: white;
  font-size: 14px;
}

.connector-label {
  position: absolute;
  top: -20px;
  font-size: 10px;
  background: rgba(0, 0, 0, 0.8);
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s;
}

.connector:hover .connector-label {
  opacity: 1;
}

/* Connection Lines */
.connection-line {
  position: absolute;
  pointer-events: none;
  z-index: 5;
}

.connection-line svg {
  overflow: visible;
}

.connection-line path {
  stroke: var(--primary);
  stroke-width: 3;
  fill: none;
  stroke-dasharray: 5;
  animation: dash 20s linear infinite;
}

@keyframes dash {
  to {
    stroke-dashoffset: 1000;
  }
}

/* Response Panel */
.response-panel {
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  max-height: 40vh;
  display: flex;
  flex-direction: column;
}

.response-header {
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.response-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.response-item {
  background: var(--bg-surface);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  border-left: 4px solid var(--primary);
}

.response-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.response-name {
  font-weight: 600;
  font-size: 14px;
}

.response-time {
  font-size: 11px;
  color: var(--text-secondary);
}

.response-text {
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  max-height: 150px;
  overflow-y: auto;
}

/* Bottom Navigation */
.bottom-nav {
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.nav-btn {
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--bg-surface);
  border: none;
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}

.nav-btn.active {
  background: var(--primary);
  color: white;
}

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: var(--bg-card);
  border-radius: 16px;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 500;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
}

.form-textarea {
  min-height: 100px;
  resize: vertical;
}

.color-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.color-option {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  cursor: pointer;
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 16px;
}

.color-option.selected {
  border-color: white;
  transform: scale(1.1);
}

/* Loading State */
.loading {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Touch-friendly improvements */
@media (hover: none) {
  .node-btn:hover {
    background: var(--bg-surface);
    color: var(--text-secondary);
  }
  
  .node-btn:active {
    background: var(--primary);
    color: white;
  }
  
  .connector:hover {
    transform: none;
  }
  
  .connector:active {
    transform: scale(1.1);
  }
}

/* Mobile-specific optimizations */
@media (max-width: 768px) {
  .workspace {
    padding: 10px;
  }
  
  .ai-node {
    width: 240px;
  }
  
  .btn span {
    display: none;
  }
  
  .btn i {
    margin: 0;
  }
  
  .response-panel {
    max-height: 30vh;
  }
}

/* Small phones */
@media (max-width: 480px) {
  .header {
    padding: 10px 12px;
  }
  
  .logo-text {
    display: none;
  }
  
  .workspace {
    padding: 8px;
  }
  
  .ai-node {
    width: 220px;
  }
  
  .node-header {
    padding: 12px;
  }
  
  .node-body {
    padding: 12px;
  }
}

/* Dark mode adjustments */
@media (prefers-color-scheme: dark) {
  :root {
    --bg-dark: #0a0a0a;
    --bg-card: #1a1a1a;
    --bg-surface: #262626;
    --border: #404040;
  }
}

/* Safe area for notch phones */
@supports (padding: max(0px)) {
  .header {
    padding-top: max(12px, env(safe-area-inset-top));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  
  .bottom-nav {
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
}
</style>
</head>
<body>
<div class="app-container">
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <i class="fas fa-brain"></i>
      </div>
      <span class="logo-text">AI Pipeline</span>
    </div>
    
    <div class="header-actions">
      <button class="btn btn-sm" onclick="toggleSidebar()">
        <i class="fas fa-layer-group"></i>
        <span>Models</span>
      </button>
      <button class="btn btn-success btn-sm" onclick="runAllModels()">
        <i class="fas fa-play"></i>
        <span>Run All</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="section-title">
          <span>AI Models</span>
          <button class="node-btn" onclick="openModelModal()">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div id="model-list">
          <!-- Models will be loaded here -->
        </div>
      </div>
      
      <div class="sidebar-section">
        <div class="section-title">Workspace</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button class="nav-btn" onclick="clearWorkspace()">
            <i class="fas fa-trash"></i> Clear
          </button>
          <button class="nav-btn" onclick="saveWorkspace()">
            <i class="fas fa-save"></i> Save
          </button>
          <button class="nav-btn" onclick="loadWorkspace()">
            <i class="fas fa-folder-open"></i> Load
          </button>
        </div>
      </div>
    </div>

    <!-- Workspace -->
    <div class="workspace" id="workspace">
      <!-- AI Nodes will be placed here -->
    </div>
  </div>

  <!-- Response Panel -->
  <div class="response-panel" id="response-panel">
    <div class="response-header">
      <span>Responses</span>
      <button class="node-btn" onclick="clearResponses()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="response-content" id="response-content">
      <!-- Responses will appear here -->
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="showTab('workspace')">
      <i class="fas fa-project-diagram"></i> Workspace
    </button>
    <button class="nav-btn" onclick="showTab('connections')">
      <i class="fas fa-link"></i> Connections
    </button>
    <button class="nav-btn" onclick="showTab('settings')">
      <i class="fas fa-cog"></i> Settings
    </button>
    <button class="nav-btn" onclick="showTab('batch')">
      <i class="fas fa-bolt"></i> Batch Run
    </button>
  </div>
</div>

<!-- Model Creation Modal -->
<div class="modal-overlay" id="model-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Create AI Model</h3>
      <button class="node-btn" onclick="closeModelModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Model Name</label>
        <input type="text" class="form-input" id="model-name" placeholder="e.g., Creative Writer">
      </div>
      
      <div class="form-group">
        <label class="form-label">Icon & Color</label>
        <div class="color-grid">
          <div class="color-option selected" style="background: #6366f1;" data-color="#6366f1">
            <i class="fas fa-robot"></i>
          </div>
          <div class="color-option" style="background: #10b981;" data-color="#10b981">
            <i class="fas fa-lightbulb"></i>
          </div>
          <div class="color-option" style="background: #8b5cf6;" data-color="#8b5cf6">
            <i class="fas fa-code"></i>
          </div>
          <div class="color-option" style="background: #f59e0b;" data-color="#f59e0b">
            <i class="fas fa-chart-bar"></i>
          </div>
          <div class="color-option" style="background: #ec4899;" data-color="#ec4899">
            <i class="fas fa-comment-medical"></i>
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">AI Model</label>
        <select class="form-select" id="model-type">
          <option value="gpt-4">GPT-4</option>
          <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
          <option value="claude-3">Claude 3</option>
          <option value="gemini-pro">Gemini Pro</option>
          <option value="llama-3">Llama 3</option>
          <option value="mistral">Mistral</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">System Prompt</label>
        <textarea class="form-textarea" id="model-prompt" placeholder="Describe how this model should behave..."></textarea>
      </div>
      
      <div class="form-group">
        <label class="form-label">Temperature</label>
        <input type="range" class="form-input" id="model-temp" min="0" max="1" step="0.1" value="0.7">
        <span id="temp-value-display">0.7</span>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn" onclick="closeModelModal()">Cancel</button>
      <button class="btn btn-success" onclick="saveModel()">Create Model</button>
    </div>
  </div>
</div>

<!-- Batch Run Modal -->
<div class="modal-overlay" id="batch-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Batch Run Configuration</h3>
      <button class="node-btn" onclick="closeBatchModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Input Prompt</label>
        <textarea class="form-textarea" id="batch-input" placeholder="Enter prompt to send to all models..."></textarea>
      </div>
      
      <div class="form-group">
        <label class="form-label">Run Mode</label>
        <select class="form-select" id="batch-mode">
          <option value="parallel">Run All Models in Parallel</option>
          <option value="sequential">Run Connected Models Sequentially</option>
          <option value="group">Run Groups Separately</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">Selected Models</label>
        <div id="model-selection">
          <!-- Model checkboxes will be added here -->
        </div>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn" onclick="closeBatchModal()">Cancel</button>
      <button class="btn btn-success" onclick="executeBatchRun()">
        <i class="fas fa-play"></i> Run Batch
      </button>
    </div>
  </div>
</div>

<script>
// State Management
const state = {
  models: [
    {
      id: 'model1',
      name: 'Creative Writer',
      icon: 'fas fa-pen-nib',
      color: '#6366f1',
      type: 'gpt-4',
      prompt: 'You are a creative writer specializing in storytelling, metaphors, and engaging narratives.',
      temperature: 0.7
    },
    {
      id: 'model2',
      name: 'Technical Analyst',
      icon: 'fas fa-chart-line',
      color: '#10b981',
      type: 'claude-3',
      prompt: 'You are a technical analyst who breaks down complex topics into logical, structured explanations.',
      temperature: 0.3
    },
    {
      id: 'model3',
      name: 'Code Assistant',
      icon: 'fas fa-code',
      color: '#8b5cf6',
      type: 'gpt-3.5-turbo',
      prompt: 'You are an expert programming assistant specializing in clean, efficient code across multiple languages.',
      temperature: 0.5
    }
  ],
  nodes: [],
  connections: [],
  selectedNode: null,
  isConnecting: false,
  connectionStart: null,
  responses: []
};

// DOM Elements
const workspace = document.getElementById('workspace');
const modelList = document.getElementById('model-list');
const responseContent = document.getElementById('response-content');
const modelModal = document.getElementById('model-modal');
const batchModal = document.getElementById('batch-modal');

// Initialize
init();

function init() {
  renderModelList();
  setupEventListeners();
  loadDefaultNodes();
}

function renderModelList() {
  modelList.innerHTML = '';
  state.models.forEach(model => {
    const div = document.createElement('div');
    div.className = 'personality-item';
    div.draggable = true;
    div.innerHTML = `
      <div class="personality-header">
        <div class="personality-icon" style="background: ${model.color}">
          <i class="${model.icon}"></i>
        </div>
        <div>
          <div class="personality-name">${model.name}</div>
          <div class="personality-model">${model.type}</div>
        </div>
      </div>
    `;
    
    div.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('modelId', model.id);
    });
    
    div.addEventListener('click', () => {
      addNodeToWorkspace(model);
    });
    
    modelList.appendChild(div);
  });
}

function setupEventListeners() {
  // Workspace drop zone
  workspace.addEventListener('dragover', (e) => {
    e.preventDefault();
  });
  
  workspace.addEventListener('drop', (e) => {
    e.preventDefault();
    const modelId = e.dataTransfer.getData('modelId');
    const model = state.models.find(m => m.id === modelId);
    if (model) {
      const rect = workspace.getBoundingClientRect();
      const x = e.clientX - rect.left - 130; // Center node
      const y = e.clientY - rect.top - 80;
      addNodeToWorkspace(model, x, y);
    }
  });
  
  // Touch events for mobile
  workspace.addEventListener('touchstart', handleTouchStart, { passive: false });
  workspace.addEventListener('touchmove', handleTouchMove, { passive: false });
  workspace.addEventListener('touchend', handleTouchEnd, { passive: false });
  
  // Temperature slider
  document.getElementById('model-temp').addEventListener('input', (e) => {
    document.getElementById('temp-value-display').textContent = e.target.value;
  });
}

function addNodeToWorkspace(model, x = 100, y = 100) {
  const nodeId = 'node_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  
  const node = {
    id: nodeId,
    modelId: model.id,
    x: Math.max(0, Math.min(x, workspace.scrollWidth - 260)),
    y: Math.max(0, Math.min(y, workspace.scrollHeight - 200)),
    connections: {
      inputs: [],
      outputs: []
    },
    status: 'idle'
  };
  
  state.nodes.push(node);
  renderNode(node, model);
  saveToLocalStorage();
}

function renderNode(node, model) {
  const nodeEl = document.createElement('div');
  nodeEl.className = 'ai-node';
  nodeEl.id = node.id;
  nodeEl.style.left = node.x + 'px';
  nodeEl.style.top = node.y + 'px';
  nodeEl.dataset.modelId = model.id;
  
  nodeEl.innerHTML = `
    <div class="node-header">
      <div class="node-title">
        <div class="node-icon" style="background: ${model.color}">
          <i class="${model.icon}"></i>
        </div>
        <div class="node-text">
          <div class="node-name">${model.name}</div>
          <div class="node-model">${model.type}</div>
        </div>
      </div>
      <div class="node-actions">
        <button class="node-btn" onclick="runSingleNode('${node.id}')" title="Run">
          <i class="fas fa-play"></i>
        </button>
        <button class="node-btn" onclick="deleteNode('${node.id}')" title="Delete">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
    <div class="node-body">
      ${model.prompt.substring(0, 100)}...
    </div>
    <div class="node-connectors">
      <div class="connector connector-input" 
           onmousedown="startConnection('${node.id}', 'input')"
           ontouchstart="startConnection('${node.id}', 'input')">
        <i class="fas fa-arrow-right"></i>
        <div class="connector-label">Input</div>
      </div>
      <div class="connector connector-output"
           onmousedown="startConnection('${node.id}', 'output')"
           ontouchstart="startConnection('${node.id}', 'output')">
        <i class="fas fa-arrow-right"></i>
        <div class="connector-label">Output</div>
      </div>
    </div>
  `;
  
  workspace.appendChild(nodeEl);
  makeNodeDraggable(nodeEl, node);
  updateConnections();
}

function makeNodeDraggable(element, node) {
  let isDragging = false;
  let startX, startY, initialX, initialY;
  
  const startDrag = (clientX, clientY) => {
    isDragging = true;
    const rect = element.getBoundingClientRect();
    startX = clientX - rect.left;
    startY = clientY - rect.top;
    initialX = node.x;
    initialY = node.y;
    element.style.zIndex = '100';
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', stopDrag);
  };
  
  const onDrag = (e) => {
    if (!isDragging) return;
    e.preventDefault();
    
    const rect = workspace.getBoundingClientRect();
    const x = e.clientX - rect.left - startX;
    const y = e.clientY - rect.top - startY;
    
    // Constrain to workspace bounds
    const maxX = workspace.scrollWidth - element.offsetWidth;
    const maxY = workspace.scrollHeight - element.offsetHeight;
    
    node.x = Math.max(0, Math.min(x, maxX));
    node.y = Math.max(0, Math.min(y, maxY));
    
    element.style.left = node.x + 'px';
    element.style.top = node.y + 'px';
    
    updateConnections();
  };
  
  const stopDrag = () => {
    isDragging = false;
    element.style.zIndex = '10';
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
    saveToLocalStorage();
  };
  
  // Mouse events
  element.addEventListener('mousedown', (e) => {
    if (e.target.closest('.connector') || e.target.closest('.node-btn')) return;
    startDrag(e.clientX, e.clientY);
  });
  
  // Touch events
  element.addEventListener('touchstart', (e) => {
    if (e.target.closest('.connector') || e.target.closest('.node-btn')) return;
    e.preventDefault();
    const touch = e.touches[0];
    startDrag(touch.clientX, touch.clientY);
  }, { passive: false });
}

function startConnection(nodeId, type) {
  state.isConnecting = true;
  state.connectionStart = { nodeId, type };
  
  const nodeEl = document.getElementById(nodeId);
  const connector = nodeEl.querySelector(type === 'input' ? '.connector-input' : '.connector-output');
  const rect = connector.getBoundingClientRect();
  const workspaceRect = workspace.getBoundingClientRect();
  
  state.connectionStart.x = rect.left + rect.width / 2 - workspaceRect.left;
  state.connectionStart.y = rect.top + rect.height / 2 - workspaceRect.top;
  
  createConnectionPreview();
}

function createConnectionPreview() {
  const preview = document.createElement('div');
  preview.className = 'connection-line';
  preview.id = 'connection-preview';
  workspace.appendChild(preview);
  
  const updatePreview = (x, y) => {
    const path = createCurvedPath(
      state.connectionStart.x,
      state.connectionStart.y,
      x,
      y
    );
    
    preview.innerHTML = `
      <svg width="100%" height="100%">
        <path d="${path}" />
      </svg>
    `;
  };
  
  const onMouseMove = (e) => {
    const rect = workspace.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    updatePreview(x, y);
  };
  
  const onTouchMove = (e) => {
    const rect = workspace.getBoundingClientRect();
    const touch = e.touches[0];
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    updatePreview(x, y);
  };
  
  const finishConnection = (targetNodeId, targetType) => {
    if (state.connectionStart.type === 'output' && targetType === 'input') {
      // Output to Input connection
      state.connections.push({
        from: state.connectionStart.nodeId,
        to: targetNodeId
      });
      
      // Update node connections
      const fromNode = state.nodes.find(n => n.id === state.connectionStart.nodeId);
      const toNode = state.nodes.find(n => n.id === targetNodeId);
      
      if (fromNode && toNode) {
        fromNode.connections.outputs.push(targetNodeId);
        toNode.connections.inputs.push(state.connectionStart.nodeId);
      }
      
      updateConnections();
      saveToLocalStorage();
    }
    
    cleanupConnection();
  };
  
  const cleanupConnection = () => {
    state.isConnecting = false;
    state.connectionStart = null;
    preview.remove();
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    document.removeEventListener('touchmove', onTouchMove);
    document.removeEventListener('touchend', onTouchEnd);
  };
  
  const onMouseUp = (e) => {
    const target = e.target.closest('.connector');
    if (target) {
      const targetNodeId = target.closest('.ai-node').id;
      const targetType = target.classList.contains('connector-input') ? 'input' : 'output';
      finishConnection(targetNodeId, targetType);
    } else {
      cleanupConnection();
    }
  };
  
  const onTouchEnd = (e) => {
    const touch = e.changedTouches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const connector = target?.closest('.connector');
    
    if (connector) {
      const targetNodeId = connector.closest('.ai-node').id;
      const targetType = connector.classList.contains('connector-input') ? 'input' : 'output';
      finishConnection(targetNodeId, targetType);
    } else {
      cleanupConnection();
    }
  };
  
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend', onTouchEnd, { passive: false });
}

function createCurvedPath(x1, y1, x2, y2) {
  const midX = (x1 + x2) / 2;
  const curve = 50;
  return `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
}

function updateConnections() {
  // Remove existing connections
  document.querySelectorAll('.connection-line:not(#connection-preview)').forEach(el => el.remove());
  
  // Render all connections
  state.connections.forEach(conn => {
    const fromNode = document.getElementById(conn.from);
    const toNode = document.getElementById(conn.to);
    
    if (!fromNode || !toNode) return;
    
    const fromOutput = fromNode.querySelector('.connector-output');
    const toInput = toNode.querySelector('.connector-input');
    
    if (!fromOutput || !toInput) return;
    
    const fromRect = fromOutput.getBoundingClientRect();
    const toRect = toInput.getBoundingClientRect();
    const workspaceRect = workspace.getBoundingClientRect();
    
    const startX = fromRect.left + fromRect.width / 2 - workspaceRect.left;
    const startY = fromRect.top + fromRect.height / 2 - workspaceRect.top;
    const endX = toRect.left + toRect.width / 2 - workspaceRect.left;
    const endY = toRect.top + toRect.height / 2 - workspaceRect.top;
    
    const path = createCurvedPath(startX, startY, endX, endY);
    
    const line = document.createElement('div');
    line.className = 'connection-line';
    line.innerHTML = `
      <svg width="100%" height="100%">
        <path d="${path}" />
      </svg>
    `;
    
    workspace.appendChild(line);
  });
}

async function runSingleNode(nodeId) {
  const node = state.nodes.find(n => n.id === nodeId);
  const model = state.models.find(m => m.id === node.modelId);
  if (!node || !model) return;
  
  // Get input from connected nodes
  let inputText = '';
  if (node.connections.inputs.length > 0) {
    const inputNode = state.nodes.find(n => n.id === node.connections.inputs[0]);
    if (inputNode && state.responses.some(r => r.nodeId === inputNode.id)) {
      const lastResponse = state.responses.filter(r => r.nodeId === inputNode.id).pop();
      inputText = lastResponse.content;
    }
  }
  
  if (!inputText) {
    inputText = prompt(`Enter input for ${model.name}:`) || '';
  }
  
  if (!inputText.trim()) {
    alert('Please provide input text');
    return;
  }
  
  await callAI(node, model, inputText);
}

async function runAllModels() {
  const input = prompt('Enter initial prompt for all models:');
  if (!input) return;
  
  // Clear previous responses
  state.responses = [];
  responseContent.innerHTML = '<div class="loading"><span class="spinner"></span> Running pipeline...</div>';
  
  // Group 1: Nodes without inputs (starting points)
  const startNodes = state.nodes.filter(node => node.connections.inputs.length === 0);
  
  // Group 2: Connected chains
  const connectedChains = [];
  const visited = new Set();
  
  for (const node of state.nodes) {
    if (!visited.has(node.id) && node.connections.inputs.length > 0) {
      const chain = [];
      let current = node;
      while (current && !visited.has(current.id)) {
        visited.add(current.id);
        chain.push(current);
        // Move to next in chain
        if (current.connections.outputs.length > 0) {
          const nextId = current.connections.outputs[0];
          current = state.nodes.find(n => n.id === nextId);
        } else {
          break;
        }
      }
      if (chain.length > 0) {
        connectedChains.push(chain);
      }
    }
  }
  
  // Run start nodes in parallel
  await Promise.all(startNodes.map(async (node) => {
    const model = state.models.find(m => m.id === node.modelId);
    if (model) {
      await callAI(node, model, input);
    }
  }));
  
  // Run connected chains
  for (const chain of connectedChains) {
    let chainInput = input;
    for (const node of chain) {
      const model = state.models.find(m => m.id === node.modelId);
      if (model) {
        const response = await callAI(node, model, chainInput, true);
        if (response) {
          chainInput = response.content;
        }
      }
    }
  }
}

async function callAI(node, model, input, isChain = false) {
  const nodeEl = document.getElementById(node.id);
  const runBtn = nodeEl.querySelector('.node-btn');
  const originalHTML = runBtn.innerHTML;
  
  // Show loading
  runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  runBtn.disabled = true;
  nodeEl.style.borderColor = '#f59e0b';
  
  try {
    // Simulate API call (replace with actual API)
    await new Promise(resolve => setTimeout(resolve, 1500));
    
    // Generate mock response based on model type
    const responses = {
      'gpt-4': `As ${model.name}, I would say: "${input}"\n\nI've analyzed this thoroughly and here's my comprehensive response. The key points are...`,
      'claude-3': `From a technical perspective: ${input}\n\nLet me break this down systematically:\n1. First point\n2. Second point\n3. Conclusion`,
      'gpt-3.5-turbo': `Here's a quick response: ${input.substring(0, 100)}...\n\nI can help you with this!`,
      'creative': `✨ Once upon a time... ${input} ✨\n\nAnd so the story unfolds with creativity and imagination!`
    };
    
    const content = responses[model.type] || `Response from ${model.name}: ${input}`;
    
    // Store response
    const response = {
      id: 'resp_' + Date.now(),
      nodeId: node.id,
      modelName: model.name,
      modelType: model.type,
      content: content,
      timestamp: new Date().toISOString(),
      input: input
    };
    
    state.responses.push(response);
    renderResponse(response);
    
    // Visual feedback
    nodeEl.style.borderColor = '#10b981';
    setTimeout(() => {
      nodeEl.style.borderColor = model.color;
    }, 2000);
    
    return response;
    
  } catch (error) {
    console.error('Error:', error);
    const errorResponse = {
      id: 'err_' + Date.now(),
      nodeId: node.id,
      modelName: model.name,
      modelType: model.type,
      content: `Error: ${error.message}`,
      timestamp: new Date().toISOString(),
      input: input,
      isError: true
    };
    
    state.responses.push(errorResponse);
    renderResponse(errorResponse);
    
    nodeEl.style.borderColor = '#ef4444';
    setTimeout(() => {
      nodeEl.style.borderColor = model.color;
    }, 2000);
    
  } finally {
    runBtn.innerHTML = originalHTML;
    runBtn.disabled = false;
  }
}

function renderResponse(response) {
  const responseEl = document.createElement('div');
  responseEl.className = 'response-item';
  if (response.isError) {
    responseEl.style.borderLeftColor = '#ef4444';
  }
  
  responseEl.innerHTML = `
    <div class="response-title">
      <span class="response-name">${response.modelName}</span>
      <span class="response-time">${new Date(response.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
    </div>
    <div class="response-text">${response.content.substring(0, 200)}${response.content.length > 200 ? '...' : ''}</div>
  `;
  
  responseEl.addEventListener('click', () => {
    alert(response.content);
  });
  
  responseContent.prepend(responseEl);
  
  // Auto-scroll to top
  responseContent.scrollTop = 0;
}

function deleteNode(nodeId) {
  if (confirm('Delete this node?')) {
    // Remove node
    state.nodes = state.nodes.filter(n => n.id !== nodeId);
    
    // Remove connections
    state.connections = state.connections.filter(c => 
      c.from !== nodeId && c.to !== nodeId
    );
    
    // Remove from other nodes' connections
    state.nodes.forEach(node => {
      node.connections.inputs = node.connections.inputs.filter(id => id !== nodeId);
      node.connections.outputs = node.connections.outputs.filter(id => id !== nodeId);
    });
    
    // Remove from DOM
    document.getElementById(nodeId)?.remove();
    
    // Update connections
    updateConnections();
    saveToLocalStorage();
  }
}

function clearWorkspace() {
  if (confirm('Clear entire workspace?')) {
    state.nodes = [];
    state.connections = [];
    workspace.innerHTML = '';
    saveToLocalStorage();

}

function clearResponses() {

async function runBatch(input, mode) {
  // Clear previous responses
  state.responses = [];
  responseContent.innerHTML = '<div class="loading"><span class="spinner"></span> Running batch...</div>';
  
  if (mode === 'parallel') {
    // Run all selected models in parallel
    const selectedNodes = getSelectedNodes();
    await Promise.all(selectedNodes.map(async (node) => {
      const model = state.models.find(m => m.id === node.modelId);
      if (model) {
        await callAI(node, model, input);
      }
    }));
    
  } else if (mode === 'sequential') {
    // Run connected models sequentially
    const selectedNodes = getSelectedNodes();
    let currentInput = input;
    
    for (const node of selectedNodes) {
      const model = state.models.find(m => m.id === node.modelId);
      if (model) {
        const response = await callAI(node, model, currentInput, true);
        if (response) {
          currentInput = response.content;
        }
      }
    }
    
  } else if (mode === 'group') {
    // Run disconnected groups separately
    const selectedNodes = getSelectedNodes();
    const groups = findDisconnectedGroups(selectedNodes);
    
    for (const group of groups) {
      // Run each group
      if (group.length === 1) {
        // Single node
        const node = group[0];
        const model = state.models.find(m => m.id === node.modelId);
        if (model) {
          await callAI(node, model, input);
        }
      } else {
        // Connected chain
        let chainInput = input;
        for (const node of group) {
          const model = state.models.find(m => m.id === node.modelId);
          if (model) {
            const response = await callAI(node, model, chainInput, true);
            if (response) {
              chainInput = response.content;
            }
          }
        }
      }
    }
  }
}

function getSelectedNodes() {
  const checkboxes = document.querySelectorAll('#model-selection input[type="checkbox"]:checked');
  const selectedIds = Array.from(checkboxes).map(cb => cb.dataset.nodeId);
  return state.nodes.filter(node => selectedIds.includes(node.id));
}

function findDisconnectedGroups(nodes) {
  const groups = [];
  const visited = new Set();
  
  for (const node of nodes) {
    if (!visited.has(node.id)) {
      const group = [];
      const queue = [node];
      
      while (queue.length > 0) {
        const current = queue.shift();
        if (!visited.has(current.id)) {
          visited.add(current.id);
          group.push(current);
          
          // Add connected nodes
          const connections = [
            ...current.connections.inputs,
            ...current.connections.outputs
          ];
          
          for (const connId of connections) {
            const connectedNode = nodes.find(n => n.id === connId);
            if (connectedNode && !visited.has(connectedNode.id)) {
              queue.push(connectedNode);
            }
          }
        }
      }
      
      if (group.length > 0) {
        groups.push(group);
      }
    }
  }
  
  return groups;
}

function loadWorkspace() {
  const saved = localStorage.getItem('ai-pipeline-workspace');
  if (saved) {
    const data = JSON.parse(saved);
    state.nodes = data.nodes || [];
    state.connections = data.connections || [];
    
    // Clear and re-render
    workspace.innerHTML = '';
    state.nodes.forEach(node => {
      const model = state.models.find(m => m.id === node.modelId);
      if (model) {
        renderNode(node, model);
      }
    });
    updateConnections();
    alert('Workspace loaded!');
  } else {
    alert('No saved workspace found');
  }
}

function saveToLocalStorage() {
  const workspaceData = {
    nodes: state.nodes,
    connections: state.connections,
    timestamp: new Date().toISOString()
  };
  
  localStorage.setItem('ai-pipeline-autosave', JSON.stringify(workspaceData));
}

function loadDefaultNodes() {
  // Auto-load saved workspace
  const saved = localStorage.getItem('ai-pipeline-autosave');
  if (saved) {
    const data = JSON.parse(saved);
    state.nodes = data.nodes || [];
    state.connections = data.connections || [];
    
    // Render saved nodes
    state.nodes.forEach(node => {
      const model = state.models.find(m => m.id === node.modelId);
      if (model) {
        renderNode(node, model);
      }
    });
    updateConnections();

        addNodeToWorkspace(state.models[0], 50, 50);
        addNodeToWorkspace(state.models[1], 350, 50);
        addNodeToWorkspace(state.models[2], 200, 250);
      }
    }, 500);
  }
}
