<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi-Model AI Personality Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, Segoe UI, sans-serif;
  background: #0b1220;
  color: #e5e7eb;
}
.wrapper {
  display: grid;
  grid-template-columns: 420px 1fr;
  height: 100vh;
}
.sidebar {
  background: #020617;
  border-right: 1px solid #1e293b;
  padding: 20px;
  overflow-y: auto;
}
.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.add-btn {
  background: #22c55e;
  border: none;
  padding: 6px 10px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}
.person-row {
  border: 1px solid #1e293b;
  border-radius: 14px;
  padding: 12px;
  margin-top: 12px;
  background: #020617;
}
.row-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.row-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.edit {
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
}
.expand {
  transition: 0.3s;
}
.person-row.open .expand {
  transform: rotate(90deg);
}
.row-body {
  display: none;
  margin-top: 10px;
  font-size: 13px;
  opacity: 0.75;
  white-space: pre-wrap;
}
.person-row.open .row-body {
  display: block;
}
.main {
  padding: 30px;
  overflow-y: auto;
}
.top {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  align-items: center;
  position: relative;
}
.top input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  white-space: pre-wrap;
}
.top button {
  padding: 14px 22px;
  border-radius: 12px;
  border: none;
  background: #22c55e;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.gear {
  font-size: 20px;
  cursor: pointer;
  background: none;
  border: none;
  color: white;
  margin-left: 6px;
  display: flex;
  align-items: center;
}
#settings {
  background-color: transparent;
  padding: 0;
  font-size: 24px;
}
.popup {
  position: absolute;
  top: 50px;
  right: 0;
  background: #020617;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 12px;
  display: none;
  z-index: 100;
}
.popup label {
  margin-right: 6px;
  font-size: 14px;
}
.popup select {
  background: #020617;
  color: white;
  border: 1px solid #1e293b;
  border-radius: 8px;
  padding: 6px;
  font-size: 14px;
  cursor: pointer;
}
.responses {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}
.card {
  background: #020617;
  border-radius: 18px;
  padding: 18px;
  border-left: 6px solid;
  white-space: pre-wrap;
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
}
.modal-content {
  background: #020617;
  padding: 20px;
  border-radius: 16px;
  width: 340px;
}
.modal-content input,
.modal-content textarea,
.modal-content select {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  background: #020617;
  border: 1px solid #1e293b;
  color: white;
  border-radius: 8px;
}
.modal-content button {
  margin-top: 14px;
  width: 100%;
  padding: 10px;
  background: #22c55e;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
.loader {
  border: 3px solid #f3f3f3;
  border-top: 3px solid #22c55e;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  animation: spin 1s linear infinite;
  display: inline-block;
  vertical-align: middle;
}
@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}
@media (max-width: 768px) {
  .wrapper { grid-template-columns: 1fr; }
  .popup { right: 10px; top: 60px; }
}
</style>
</head>
<body>
<div class="wrapper">
<div class="sidebar">
  <div class="sidebar-header">
    <h3>Personalities</h3>
    <button class="add-btn" onclick="addPersonality()">+ Add</button>
  </div>
  <div id="list"></div>
</div>
<div class="main">
  <div class="top">
    <input id="question" placeholder="Ask something..." />
    <button id="runBtn" onclick="run()">Run</button>
    <button class="gear" id="settings" onclick="togglePopup()">  
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="25px" height="25px">
        <path fill="white" d="M47.16,21.221l-5.91-0.966c-0.346-1.186-0.819-2.326-1.411-3.405l3.45-4.917c0.279-0.397,0.231-0.938-0.112-1.282
        l-3.889-3.887c-0.347-0.346-0.893-0.391-1.291-0.104l-4.843,3.481c-1.089-0.602-2.239-1.08-3.432-1.427l-1.031-5.886
        C28.607,2.35,28.192,2,27.706,2h-5.5c-0.49,0-0.908,0.355-0.987,0.839l-0.956,5.854c-1.2,0.345-2.352,0.818-3.437,1.412l-4.83-3.45
        c-0.399-0.285-0.942-0.239-1.289,0.106L6.82,10.648c-0.343,0.343-0.391,0.883-0.112,1.28l3.399,4.863
        c-0.605,1.095-1.087,2.254-1.438,3.46l-5.831,0.971c-0.482,0.08-0.836,0.498-0.836,0.986v5.5c0,0.485,0.348,0.9,0.825,0.985
        l5.831,1.034c0.349,1.203,0.831,2.362,1.438,3.46l-3.441,4.813c-0.284,0.397-0.239,0.942,0.106,1.289l3.888,3.891
        c0.343,0.343,0.884,0.391,1.281,0.112l4.87-3.411c1.093,0.601,2.248,1.078,3.445,1.424l0.976,5.861C21.3,47.647,21.717,48,22.206,48
        h5.5c0.485,0,0.9-0.348,0.984-0.825l1.045-5.89c1.199-0.353,2.348-0.833,3.43-1.435l4.905,3.441
        c0.398,0.281,0.938,0.232,1.282-0.111l3.888-3.891c0.346-0.347,0.391-0.894,0.104-1.292l-3.498-4.857
        c0.593-1.08,1.064-2.222,1.407-3.408l5.918-1.039c0.479-0.084,0.827-0.5,0.827-0.985v-5.5C47.999,21.718,47.644,21.3,47.16,21.221z
         M25,32c-3.866,0-7-3.134-7-7c0-3.866,3.134-7,7-7s7,3.134,7,7C32,28.866,28.866,32,25,32z"/>
    </svg>
    </button>
    <div class="popup" id="popup">
      <label>Direction:</label>
      <select id="dirSelect" onchange="changeDirection()">
        <option value="ltr">LTR</option>
        <option value="rtl">RTL</option>
      </select>
    </div>
  </div>
  <div id="responses" class="responses"></div>
</div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Edit Personality</h3>
    <input id="mName" placeholder="Name">
    <input id="mIcon" placeholder="Icon (emoji)">
    <input id="mColor" placeholder="Color (#hex)">
    <select id="mModel">
      <option>openai/gpt-oss-20b:free</option>
      <option>google/gemma-3-27b-it:free</option>
      <option>mistralai/devstral-2512:free</option>
      <option>tngtech/deepseek-r1t2-chimera:free</option>
      <option>nvidia/nemotron-nano-12b-v2-vl:free</option>
      <option>qwen/qwen3-coder:free</option>
    </select>
    <textarea id="mPrompt" rows="4" placeholder="Prompt"></textarea>
    <button onclick="savePersonality()">Save</button>
  </div>
</div>
<script>
const API_URL = "https://ai-openrouter-proxy.abolfazl-kbahrami-ec0.workers.dev";

let personalities = [
  { name:"Creative", icon:"🎨", color:"#fb7185", model:"openai/gpt-oss-20b:free", prompt:"Generate creative ideas." },
  { name:"Logical", icon:"🧠", color:"#38bdf8", model:"tngtech/deepseek-r1t2-chimera:free", prompt:"Think step by step logically." },
  { name:"Summary", icon:"📌", color:"#a78bfa", model:"mistralai/devstral-2512:free", prompt:"Summarize all responses clearly." }
];

let editIndex = null;

function renderList() {
  list.innerHTML = "";
  personalities.forEach((p,i) => {
    const row = document.createElement("div");
    row.className = "person-row";
    row.innerHTML = `
      <div class="row-header" onclick="row.classList.toggle('open')">
        <div class="row-left">
          <span>${p.icon}</span><strong>${p.name}</strong>
        </div>
        <div class="actions">
          <span class="expand">➜</span>
          <span class="edit" onclick="event.stopPropagation(); openModal(${i})">✏️</span>
        </div>
      </div>
      <div class="row-body">
        Model: ${p.model}<br>
        ${p.prompt}
      </div>
    `;
    list.appendChild(row);
  });
}

function openModal(i) {
  editIndex = i;
  const p = personalities[i];
  mName.value = p.name;
  mIcon.value = p.icon;
  mColor.value = p.color;
  mPrompt.value = p.prompt;
  mModel.value = p.model;
  modal.style.display = "flex";
}

function savePersonality() {
  personalities[editIndex] = {
    name: mName.value,
    icon: mIcon.value,
    color: mColor.value,
    model: mModel.value,
    prompt: mPrompt.value
  };
  modal.style.display = "none";
  renderList();
}

function addPersonality() {
  personalities.push({
    name:"New AI",
    icon:"🤖",
    color:"#22c55e",
    model:"openai/gpt-oss-20b:free",
    prompt:"Describe behavior here."
  });
  renderList();
}

renderList();

async function callAI(p, input) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: p.model,
        messages: [
          { role: "system", content: p.prompt },
          { role: "user", content: input }
        ]
      })
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || "No response";
  } catch (e) {
    return "Error fetching response";
  }
}

async function run() {
  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  btn.innerHTML = 'Running <span class="loader"></span>';
  responses.innerHTML = "";

  const dir = dirSelect.value;

  for (let p of personalities) {
    const card = document.createElement("div");
    card.className = "card";
    card.style.borderColor = p.color;
    card.style.textAlign = dir === "rtl" ? "right" : "left";
    card.innerHTML = `<strong>${p.icon} ${p.name} <small>(${p.model})</small></strong><p>Loading...</p>`;
    responses.appendChild(card);

    const text = await callAI(p, question.value);
    card.querySelector('p').innerText = text;
  }

  btn.disabled = false;
  btn.innerHTML = 'Run';
}

function togglePopup() {
  popup.style.display = popup.style.display === "flex" ? "none" : "flex";
}

function changeDirection() {
  const dir = dirSelect.value;
  question.style.textAlign = dir === "rtl" ? "right" : "left";
  document.querySelectorAll(".card").forEach(c => {
    c.style.textAlign = dir === "rtl" ? "right" : "left";
  });
}

question.addEventListener("keypress", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    run();
  }
});
</script>
